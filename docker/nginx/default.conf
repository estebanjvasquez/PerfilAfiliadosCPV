server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    # index.html primero: sirve paginas estaticas (ej. public/cira-test/index.html) cuando se pide
    # el directorio sin nombre de archivo, sin eso nginx intenta listar el directorio (autoindex
    # off) y devuelve 403 en vez de la pagina (encontrado en vivo: /cira-test/ -> 403, /cira-test/
    # index.html -> 200).
    index index.html index.php;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Este nginx solo recibe trafico de cloudflared (bind a 127.0.0.1:8080, nunca expuesto
        # publicamente), y cloudflared solo entrega trafico que Cloudflare ya termino en HTTPS
        # en su borde. Sin esto, Laravel ve la conexion interna (nginx->php-fpm) como HTTP plano
        # y genera url()/asset()/route() con esquema http:// - eso rompe login/registro/enlaces
        # (encontrado en vivo: /admin redirigia a http://, no https://).
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
