<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CIRA — Entorno de Pruebas (MCP)</title>
<link rel="preconnect" href="https://vmi2945958.contaboserver.net">
<style>
  :root{ --gold:#faa819; --gold-soft:#fff8ee; }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f2f2f2; color:#222; height:100vh; display:flex; flex-direction:column;
  }
  .banner{
    background:#1a1a2e; color:#fff; padding:10px 16px; font-size:13px; text-align:center;
    line-height:1.5;
  }
  .banner strong{ color:var(--gold); }
  header{
    display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff;
    border-bottom:1px solid #e2e2e2; flex-shrink:0;
  }
  header img{ width:36px; height:36px; border-radius:50%; }
  header .title{ font-weight:700; font-size:15px; }
  header .sub{ font-size:11px; color:#888; }
  header .session{ margin-left:auto; font-size:11px; color:#999; text-align:right; }
  header button{
    margin-left:12px; border:1px solid #ddd; background:#fff; border-radius:20px;
    padding:6px 12px; font-size:12px; cursor:pointer; color:#444;
  }
  header button:hover{ border-color:var(--gold); color:var(--gold); }
  main{ flex:1; overflow:hidden; display:flex; flex-direction:column; max-width:760px; width:100%; margin:0 auto; background:#fff; }
  #msgs{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#f9f9f9; }
  .row{ display:flex; gap:8px; align-items:flex-start; }
  .row.user{ justify-content:flex-end; }
  .bubble{ padding:11px 14px; border-radius:10px; max-width:82%; font-size:14px; line-height:1.55; word-break:break-word; }
  .row.user .bubble{ background:var(--gold); color:#fff; }
  .row.bot .bubble{ background:#fff; border:1px solid #e0e0e0; }
  .avatar{ width:26px; height:26px; border-radius:50%; flex-shrink:0; margin-top:2px; }
  .meta-tag{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.03em;
    color:#999; margin-bottom:4px; font-weight:600;
  }
  .loader{ font-style:italic; color:#888; display:flex; align-items:center; gap:8px; }
  .spinner{ width:13px; height:13px; border:2px solid var(--gold); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  footer{ display:flex; padding:10px; gap:8px; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
  textarea{
    flex:1; border-radius:20px; border:1px solid #ddd; padding:9px 14px; resize:none;
    height:42px; font-size:14px; font-family:inherit; outline:none;
  }
  textarea:focus{ border-color:var(--gold); }
  button.send{
    width:40px; height:40px; border-radius:50%; border:none; background:var(--gold);
    color:#fff; cursor:pointer; font-size:16px; flex-shrink:0;
  }
  button.send:hover{ opacity:.85; }
  .quick{ display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 10px; }
  .quick button{
    border:1px solid #ddd; background:var(--gold-soft); border-radius:14px; padding:5px 10px;
    font-size:11px; cursor:pointer; color:#7a5800;
  }
  .quick button:hover{ border-color:var(--gold); }
  .debug-badge{
    background:#1a1a2e; color:var(--gold); font-size:10px; font-weight:700; padding:3px 8px;
    border-radius:10px; margin-left:8px; letter-spacing:.03em;
  }
  .debug-block{
    margin-top:8px; border:1px dashed #999; border-radius:8px; background:#111; color:#d8d8d8;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:11px;
  }
  .debug-header{
    display:flex; align-items:center; justify-content:space-between; padding:8px 10px;
    border-bottom:1px solid #333; color:var(--gold); font-weight:700;
  }
  .debug-header button{
    background:#222; color:#eee; border:1px solid #444; border-radius:12px; padding:4px 10px;
    font-size:11px; cursor:pointer;
  }
  .debug-header button:hover{ border-color:var(--gold); color:var(--gold); }
  .debug-body{ padding:8px 10px; max-height:420px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .debug-summary{ padding:6px 10px; border-top:1px solid #333; color:#aaa; font-size:10px; }
</style>
</head>
<body>

  <div class="banner">
    🧪 <strong>Ambiente de pruebas — Fase MCP-2</strong>: conectado al flujo clonado de n8n
    ("Chat CIRA V5 - MCP"), no al bot de producción. Las conversaciones acá no las ve ningún
    visitante real del sitio.
  </div>

  <header>
    <img src="/images/cirabot.png" alt="CIRA">
    <div>
      <div class="title">CIRA — Asistente CPV</div>
      <div class="sub">Entorno de pruebas MCP</div>
    </div>
    <span id="debug-badge" class="debug-badge" hidden>DEBUG ON</span>
    <div class="session">sesión: <span id="sid-label">—</span></div>
    <button id="reset-btn" type="button">Nueva conversación</button>
  </header>

  <main>
    <div class="quick" id="quick"></div>
    <div id="msgs"></div>
    <footer>
      <textarea id="input" rows="1" placeholder="Escribe una consulta de prueba..."></textarea>
      <button class="send" id="send" type="button">&#10148;</button>
    </footer>
  </main>

<script>
(function(){
  "use strict";

  // Webhook del flujo CLONADO de n8n ("Chat CIRA V5 - MCP", zbVLoCdR09IA9yQK) — Fase MCP-2.
  // Requiere que ese workflow esté ACTIVO en n8n; si no, el fetch devuelve 404.
  var WEBHOOK_URL = "https://vmi2945958.contaboserver.net/webhook/4882efaf-6d0e-44ae-82fe-61ebab61f54b";

  // Fase 23B: endpoint de DEBUG, fuera de n8n y del protocolo MCP - ver docblock de
  // handleDebugSearch en perfilafiliados-mcp/src/index.ts. Esta página NUNCA guarda la clave en su
  // código fuente - la pide con "/debug-on <clave>" y la guarda solo en sessionStorage del
  // navegador (se pierde al cerrar la pestaña).
  var DEBUG_URL = "https://perfilafiliados-mcp.sisteg.workers.dev/debug-search";
  var DEBUG_KEY = "cira_debug_password";

  var msgs   = document.getElementById("msgs");
  var input  = document.getElementById("input");
  var send   = document.getElementById("send");
  var sidLbl = document.getElementById("sid-label");
  var quick  = document.getElementById("quick");

  var SID_KEY = "cira_test_sid"; // distinto de "cira_sid" (producción) a propósito
  var sid = newSid();
  renderSid();

  function newSid(){
    var s = "test-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString());
    sessionStorage.setItem(SID_KEY, s);
    return s;
  }
  function renderSid(){ sidLbl.textContent = sid.replace("test-", "").slice(0, 8) + "…"; }

  document.getElementById("reset-btn").onclick = function(){
    sid = newSid();
    renderSid();
    msgs.innerHTML = "";
    addBot("Conversación reiniciada. ¿Qué querés probar?", null);
  };

  var QUICK_PROMPTS = [
    "hola",
    "operadores",
    "necesito una empresa de perforacion",
    "necesito arbolitos para pozos petroleros",
    "dame todas las empresas",
    "como me afilio a la camara?"
  ];
  QUICK_PROMPTS.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = p;
    b.onclick = function(){ sendMsg(p); };
    quick.appendChild(b);
  });

  function linkify(text){
    return String(text).replace(/\n/g, "<br>");
  }

  function addUser(text){
    var row = document.createElement("div");
    row.className = "row user";
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector(".bubble").textContent = text;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addBot(html, type){
    var row = document.createElement("div");
    row.className = "row bot";
    var tag = type ? '<div class="meta-tag">type: ' + type + '</div>' : "";
    row.innerHTML =
      '<img class="avatar" src="/images/cirabot.png" alt="">' +
      '<div class="bubble">' + tag + linkify(html) + '</div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addLoader(){
    var row = document.createElement("div");
    row.className = "row bot";
    row.id = "loader-row";
    row.innerHTML =
      '<img class="avatar" src="/images/cirabot.png" alt="">' +
      '<div class="bubble loader"><div class="spinner"></div><span>Procesando…</span></div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function removeLoader(){
    var l = document.getElementById("loader-row");
    if(l) l.remove();
  }

  window.sendPrompt = function(text){ sendMsg(text); };

  // ---- Fase 23B: modo DEBUG (/debug-on, /debug-off, /debug-status) ----
  // Observa el pipeline, no lo altera: la respuesta normal de CIRA sigue viniendo del MISMO
  // webhook de n8n, sin ningún cambio. Cuando debug está ON, en paralelo (nunca en vez de) se
  // llama a /debug-search y se muestra el reporte técnico debajo de la respuesta normal.
  function debugPassword(){ return sessionStorage.getItem(DEBUG_KEY); }
  function isDebugOn(){ return !!debugPassword(); }
  function refreshDebugBadge(){
    document.getElementById("debug-badge").hidden = !isDebugOn();
  }

  function tryHandleDebugCommand(text){
    var trimmed = text.trim();

    if(/^\/debug-status$/i.test(trimmed)){
      addUser(text);
      addBot("DEBUG MODE: " + (isDebugOn() ? "ON" : "OFF"), null);
      return true;
    }

    if(/^\/debug-off$/i.test(trimmed)){
      addUser(text);
      sessionStorage.removeItem(DEBUG_KEY);
      refreshDebugBadge();
      addBot("🔧 DEBUG MODE: OFF", null);
      return true;
    }

    var onMatch = trimmed.match(/^\/debug-on\s+(.+)$/i);
    if(onMatch){
      addUser(text);
      var candidate = onMatch[1].trim();
      addLoader();
      fetch(DEBUG_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + candidate },
        body: JSON.stringify({ query: "prueba de clave" })
      }).then(function(r){
        removeLoader();
        if(r.status === 401){
          addBot("🔧 Clave incorrecta - DEBUG sigue OFF.", "error");
          return;
        }
        sessionStorage.setItem(DEBUG_KEY, candidate);
        refreshDebugBadge();
        addBot("🔧 DEBUG MODE: ON\nLas próximas búsquedas incluirán trazabilidad completa del pipeline.", null);
      }).catch(function(e){
        removeLoader();
        addBot("Error de conexión al activar DEBUG: " + e.message, "error");
      });
      return true;
    }

    if(/^\/debug-on$/i.test(trimmed)){
      addUser(text);
      addBot("Uso: /debug-on [clave]", null);
      return true;
    }

    return false;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function addDebugBlock(report){
    var id = "debug-" + Math.random().toString(36).slice(2, 9);
    var json = JSON.stringify(report, null, 2);
    var row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML =
      '<div style="width:26px;flex-shrink:0"></div>' +
      '<div class="debug-block" style="flex:1;min-width:0">' +
        '<div class="debug-header">' +
          '<span>🔧 CIRA SEARCH DEBUG · ' + escapeHtml(report.debug_id) + '</span>' +
          '<button type="button" data-copy="' + id + '">Copiar debug</button>' +
        '</div>' +
        '<div class="debug-summary">' +
          'intent: ' + escapeHtml(report.query_understanding.detected_intent) +
          ' · conceptos: ' + escapeHtml(report.query_understanding.canonical_concepts.join(", ") || "—") +
          ' · candidatos: ' + report.candidate_generation.candidates_before_dedup + ' → ' + report.candidate_generation.candidates_after_dedup +
          ' · flags: ' + escapeHtml(report.diagnostic_flags.join(", ")) +
          ' · ' + report.timings_ms.total + 'ms' +
        '</div>' +
        '<pre class="debug-body" id="' + id + '">' + escapeHtml(json) + '</pre>' +
      '</div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;

    row.querySelector("[data-copy]").onclick = function(){
      navigator.clipboard.writeText(json).then(function(){
        row.querySelector("[data-copy]").textContent = "¡Copiado!";
        setTimeout(function(){ row.querySelector("[data-copy]").textContent = "Copiar debug"; }, 1500);
      });
    };
  }

  // Regresión 2026-09-23 (audit/cira_test_json_error_2026-09-23.md): antes de esto, tanto
  // fetchDebugReport() como sendMsg() llamaban `r.json()` directo apenas `r.ok` era true - un 200
  // con body vacío (confirmado real: el webhook de n8n a veces responde así) hacía que el navegador
  // tirara "Unexpected end of JSON input" en vez del fallo real. `parseJsonResponseOrThrow()`
  // preserva el fallo HTTP real (status + lo que haya en el body) en vez de dejar que se pierda
  // detrás de un error de parseo genérico.
  async function parseJsonResponseOrThrow(r){
    var contentType = (r.headers && r.headers.get && r.headers.get("content-type")) || "";
    var text = await r.text();

    if(!r.ok){
      throw new Error("HTTP " + r.status + ": " + (text ? text.slice(0, 300) : "(respuesta vacía)"));
    }
    if(!text){
      throw new Error("HTTP " + r.status + ": el servidor respondió sin body (respuesta vacía) - ver audit/cira_test_json_error_2026-09-23.md");
    }
    if(contentType.indexOf("application/json") === -1){
      throw new Error("HTTP " + r.status + ": se esperaba JSON pero llegó '" + (contentType || "sin content-type") + "'");
    }
    try {
      return JSON.parse(text);
    } catch(parseErr){
      throw new Error("HTTP " + r.status + ": JSON inválido en la respuesta (" + text.slice(0, 200) + ")");
    }
  }

  async function fetchDebugReport(text){
    var password = debugPassword();
    if(!password) return;

    try {
      var r = await fetch(DEBUG_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + password },
        body: JSON.stringify({ query: text })
      });
      if(r.status === 401){
        addBot("🔧 DEBUG: la clave guardada dejó de ser válida - usá /debug-on [clave] de nuevo.", "error");
        sessionStorage.removeItem(DEBUG_KEY);
        return;
      }
      var report = await parseJsonResponseOrThrow(r);
      addDebugBlock(report);
    } catch(e){
      addBot("🔧 DEBUG: error de conexión - " + e.message, "error");
    }
  }

  async function sendMsg(text){
    if(typeof text !== "string" || !text){ text = input.value.trim(); }
    if(!text) return;

    if(tryHandleDebugCommand(text)){
      input.value = "";
      return;
    }

    addUser(text);
    input.value = "";
    addLoader();

    var t0 = Date.now();
    try {
      var r = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatInput: text, sessionId: sid })
      });

      var elapsed = Date.now() - t0;
      removeLoader();

      // Regresión 2026-09-23: el workflow de n8n a veces responde 200 con body VACÍO (confirmado
      // reproducible desde afuera, no un caso hipotético) - antes esto llegaba directo a `r.json()`
      // y el navegador mostraba "Unexpected end of JSON input", ocultando que en realidad la
      // respuesta llegó vacía. `parseJsonResponseOrThrow()` conserva el diagnóstico real.
      var data = await parseJsonResponseOrThrow(r);
      var item = Array.isArray(data) ? data[0] : data;
      var reply = item && (item.output || item.text);
      addBot(reply || "Sin respuesta.", (item && item.type) ? item.type + " · " + elapsed + "ms" : elapsed + "ms");

      // Fase 23B: llamada APARTE, de solo lectura, nunca reemplaza ni modifica lo que CIRA ya
      // respondió arriba - si falla, la respuesta normal ya se mostró igual.
      if(isDebugOn()) fetchDebugReport(text);

    } catch(e){
      removeLoader();
      addBot("Error de conexión: " + e.message + " — ¿el workflow clonado está activo en n8n?", "error");
    }
  }

  send.onclick = function(){ sendMsg(); };
  input.addEventListener("keypress", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); }
  });
  input.addEventListener("input", function(){
    this.style.height = "42px";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  refreshDebugBadge();
  addBot("¡Hola! Este es el entorno de pruebas del flujo MCP-2. Probá cualquier consulta o usá los atajos de arriba. Comandos: /debug-on [clave], /debug-off, /debug-status.", null);
})();
</script>
</body>
</html>
