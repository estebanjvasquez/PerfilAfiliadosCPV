# Entorno de pruebas/producción en Contabo. La base de datos NO corre acá (es Supabase, externo) -
# este compose solo levanta la app en sí. Ver docs/arquitectura_final_contabo_cloudflare.md.
#
# cloudflared (Cloudflare Tunnel) corre como su propio servicio systemd en el host, no acá - así
# sobrevive independientemente de si se reinicia el stack de la app.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      # Sin esto, `php artisan filament:assets` (que corre en un contenedor `docker compose run
      # --rm`, efimero) escribe css/js publicados en el filesystem del CONTENEDOR, no del host -
      # se destruyen al salir el contenedor. nginx sirve ./public del HOST (abajo, :ro) y nunca
      # veia esos archivos: panel de Filament sin ningun estilo/JS (encontrado en vivo: /admin
      # cargaba pero completamente roto visualmente, 404 en /css|js/filament/**).
      - ./public:/var/www/html/public

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Montar el DIRECTORIO, no el archivo suelto: `git reset --hard` reemplaza default.conf
      # (rename a un inodo nuevo), y un bind mount de un archivo individual queda pegado al
      # inodo viejo - nginx sigue sirviendo la config de antes para siempre, sin importar cuántos
      # `nginx -s reload` se hagan, hasta recrear el contenedor a mano. Un bind mount de directorio
      # sí seguí los reemplazos-por-rename dentro de él (encontrado en vivo en esta sesión).
      - ./docker/nginx:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public:ro
