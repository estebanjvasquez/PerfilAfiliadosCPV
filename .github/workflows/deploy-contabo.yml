name: Deploy a Contabo

# Dispara en push a la rama de despliegue. Cambiar 'feature/upgrade-filament-v3' por la rama
# definitiva cuando se decida (ver docs/arquitectura_final_contabo_cloudflare.md).
on:
  push:
    branches:
      - feature/upgrade-filament-v3
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          # El VPS de Contabo tiene I/O de disco con latencia alta (confirmado con vmstat: ~25%
          # wait, CPU casi libre) — cada `docker compose run` arranca un contenedor nuevo y ese
          # boot de Laravel por sí solo tarda ~28s ahí (normal es <1s). Con 6-8 `run` separados
          # más el build sin cache, el comando entero supera fácil los 10 minutos. Por eso: un
          # solo `run` encadenado para todos los artisan (un solo boot, no seis) y timeout amplio.
          command_timeout: 20m
          script: |
            set -e
            cd /opt/perfilafiliados
            git fetch origin
            git reset --hard origin/feature/upgrade-filament-v3
            # storage/ es un bind mount del host (docker-compose.yml) - el `git reset --hard`
            # de arriba corre como root vía SSH y deja los archivos root:root. El Dockerfile hace
            # chown a www-data, pero eso queda tapado en runtime por el bind mount. Sin esto,
            # PHP-FPM (corre como www-data, uid 33) no puede escribir logs/cache/sesiones y cada
            # request termina en 500 genérico (encontrado y diagnosticado en vivo en esta sesión).
            chown -R 33:33 storage bootstrap/cache
            docker compose build app
            # composer install ya corrió dentro del build (Dockerfile) - no hace falta repetirlo
            # acá, cada `docker compose run` extra cuesta ~28s+ de boot en este disco.
            docker compose run --rm app sh -c '
              set -e
              php artisan down || true
              php artisan db:skip-mysql-only-view-migrations
              php artisan migrate --force
              php artisan filament:assets
              php artisan config:cache
              php artisan view:cache
            '
            docker compose up -d
            # docker/nginx/default.conf esta bind-mounted (no forma parte de la imagen), asi que
            # `docker compose up -d` no reinicia nginx solo porque el archivo cambio en disco -
            # nginx no relee su config solo. Reload explicito y sin downtime (encontrado en vivo:
            # un cambio a ese archivo no se aplicaba hasta reiniciar el contenedor a mano).
            docker compose exec -T nginx nginx -s reload
            docker compose exec -T app php artisan up
