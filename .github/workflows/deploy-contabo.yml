name: Deploy a Contabo

# Dispara en push a la rama de despliegue. Cambiar 'feature/upgrade-filament-v3' por la rama
# definitiva cuando se decida (ver docs/arquitectura_final_contabo_cloudflare.md).
#
# TASK-0005 (Issue #2 comentario `5914793857`, sección G): `paths-ignore` evita redeployar staging
# cuando un push toca EXCLUSIVAMENTE archivos que no pueden afectar el runtime - encontrado en vivo
# en TASK-0004 ronda 7 (comentario `5914676402`): cada commit solo-documentación disparaba un
# rebuild+redeploy completo innecesario.
#
# Semántica exacta de `paths-ignore` de GitHub Actions (todo-o-nada sobre el PUSH completo, no
# archivo por archivo): el workflow se SALTA solo si TODOS los archivos cambiados en el push
# matchean alguno de los patrones de abajo. Si UN SOLO archivo cambiado no matchea ninguno (ej. un
# commit mixto docs+código), el workflow SÍ dispara igual - conservador por diseño, nunca al revés.
#
# Casos representativos (documentados, no solo declarados):
# - Push que SOLO toca `docs/**`, `audit/**`, o `*.md`/`**.md` sueltos (ej. checkpoints del
#   orquestador, notas de arquitectura) -> NO dispara deploy. Ninguno de estos archivos se lee en
#   ningún momento por el runtime de Laravel/PHP - ni siquiera se copian a una imagen Docker
#   "servida" de forma distinta (el `git reset --hard` del script los trae igual, simplemente no
#   hace falta rebuildear/reiniciar nada por ellos).
# - Push que toca `app/**`, `resources/**`, `routes/**`, `database/migrations/**`,
#   `composer.json`/`composer.lock`, `Dockerfile`, `docker-compose.yml`, `docker/**`,
#   `.github/workflows/**`, o cualquier archivo de configuración/runtime -> SIGUE disparando deploy
#   sin cambios (no matchea ningún patrón de `paths-ignore`).
# - Push que toca `tests/**` ÚNICAMENTE (sin ningún cambio de `app/`/runtime en el mismo commit):
#   decisión deliberada de esta tarea, `tests/**` NO se agrega a `paths-ignore` a propósito. Los
#   tests no corren en el contenedor de staging como parte de servir tráfico (no afectan el
#   comportamiento real), así que técnicamente sería seguro ignorarlos también - pero el pedido
#   explícito de esta tarea es "be conservative... do not create a filter broad enough to suppress
#   a legitimate deployment", y un commit que solo toca tests, aunque no *necesite* redeploy para
#   corrección, tampoco es un caso que valga la pena optimizar a costa de ampliar el filtro - se
#   prefiere errar redesplegando de más (inofensivo, ~lo mismo que ya pasaba antes de esta tarea)
#   que de menos.
on:
  push:
    branches:
      - feature/upgrade-filament-v3
    paths-ignore:
      - 'docs/**'
      - 'audit/**'
      - '**.md'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          # El VPS de Contabo tiene I/O de disco con latencia alta (confirmado con vmstat: ~25%
          # wait, CPU casi libre) — cada `docker compose run` arranca un contenedor nuevo y ese
          # boot de Laravel por sí solo tarda ~28s ahí (normal es <1s). Con 6-8 `run` separados
          # más el build sin cache, el comando entero supera fácil los 10 minutos. Por eso: un
          # solo `run` encadenado para todos los artisan (un solo boot, no seis) y timeout amplio.
          command_timeout: 20m
          script: |
            set -e
            cd /opt/perfilafiliados
            git fetch origin
            git reset --hard origin/feature/upgrade-filament-v3
            # storage/ es un bind mount del host (docker-compose.yml) - el `git reset --hard`
            # de arriba corre como root vía SSH y deja los archivos root:root. El Dockerfile hace
            # chown a www-data, pero eso queda tapado en runtime por el bind mount. Sin esto,
            # PHP-FPM (corre como www-data, uid 33) no puede escribir logs/cache/sesiones y cada
            # request termina en 500 genérico (encontrado y diagnosticado en vivo en esta sesión).
            chown -R 33:33 storage bootstrap/cache
            docker compose build app
            # composer install ya corrió dentro del build (Dockerfile) - no hace falta repetirlo
            # acá, cada `docker compose run` extra cuesta ~28s+ de boot en este disco.
            docker compose run --rm app sh -c '
              set -e
              php artisan down || true
              # Encontrado en vivo (7 sep 2026, al agregar 3x1io/filament-user +
              # stechstudio/filament-impersonate + lab404/laravel-impersonate +
              # queents/console-helpers): el `composer dump-autoload --optimize` del
              # Dockerfile SI corre su post-autoload-dump (package:discover), pero
              # bootstrap/cache/packages.php quedo sin esos 4 paquetes nuevos pese a
              # que vendor/composer/installed.json ya los tenia bien - re-correrlo
              # aca a mano (con el .env real ya disponible, a diferencia del build)
              # lo repara sin falta. No hizo falta antes porque hasta ahora nunca se
              # habia agregado un paquete nuevo end-to-end en un deploy de esta rama.
              php artisan package:discover --ansi
              php artisan db:skip-mysql-only-view-migrations
              php artisan migrate --force
              php artisan filament:assets
              php artisan config:cache
              php artisan view:cache
            '
            docker compose up -d
            # docker/nginx/default.conf esta bind-mounted (no forma parte de la imagen), asi que
            # `docker compose up -d` no reinicia nginx solo porque el archivo cambio en disco -
            # nginx no relee su config solo. Reload explicito y sin downtime (encontrado en vivo:
            # un cambio a ese archivo no se aplicaba hasta reiniciar el contenedor a mano).
            docker compose exec -T nginx nginx -s reload
            docker compose exec -T app php artisan up
